name: CI

# Every push and pull request, plus a nightly run that re-checks the finished
# parts against dependency drift (new patch releases within the pinned ranges).
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: haushalt
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: haushalt_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U haushalt" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
        env:
          HAUSHALT_TEST_DATABASE_URL: postgresql+psycopg://haushalt:ci@127.0.0.1:5432/haushalt_test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python -m venv backend/.venv && backend/.venv/bin/pip install -r backend/requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  containers:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deployment/Containerfile.api -t haushalt-api .
      - run: docker build -f deployment/Containerfile.web -t haushalt-web .
      - name: Smoke test the images
        run: |
          docker network create haushalt
          docker run -d --name api --network haushalt -e HAUSHALT_SECRET=ci haushalt-api
          docker run -d --name web --network haushalt -p 3200:3200 -e HAUSHALT_COOKIE_SECURE=false haushalt-web
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3200/api/v1/health && break; sleep 2; done
          curl -fs http://127.0.0.1:3200/api/v1/health
          curl -fs -o /dev/null http://127.0.0.1:3200/login
