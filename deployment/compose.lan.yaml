# Optional: HTTPS in the local network instead of (or next to) `tailscale serve`.
# Adds a Caddy in front of the web container with its own local CA
# (`tls internal`). Start both files together:
#   docker compose -f deployment/compose.yaml -f deployment/compose.lan.yaml up -d --build
# Set HAUSHALT_LAN_HOST, HAUSHALT_LAN_IP and HAUSHALT_PUBLIC_ORIGIN in
# deployment/.env (see .env.example). Devices must trust the CA once, see
# README "Access from the local network".

services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    restart: unless-stopped
    environment:
      HAUSHALT_LAN_HOST: ${HAUSHALT_LAN_HOST:?set HAUSHALT_LAN_HOST in deployment/.env}
      HAUSHALT_LAN_IP: ${HAUSHALT_LAN_IP:?set HAUSHALT_LAN_IP in deployment/.env}
    ports:
      # rootless Podman cannot bind 443: publish 8443 and redirect 443 on the
      # host if wanted (README)
      - "${HAUSHALT_LAN_IP}:${HAUSHALT_LAN_PORT:-8443}:8443"
    volumes:
      - ./Caddyfile.lan:/etc/caddy/Caddyfile:ro,Z
      # the local CA and its certificates - keep it, else every device has
      # to trust a new CA
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    # the caddy binary carries this file capability; without it in the
    # bounding set the kernel refuses to start it
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]

volumes:
  caddy-data:
  caddy-config:
